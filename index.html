
<div style="padding: 1rem 0;">
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary);">
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #185FA5;"></span>联邦基金利率（上限）</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #D85A30;"></span>CPI同比通胀率</span>
</div>
<div style="position: relative; width: 100%; height: 400px;">
  <canvas id="fedChart"></canvas>
</div>
<div style="margin-top: 8px; font-size: 11px; color: var(--color-text-secondary);">
  数据来源：美联储 (FRED)、美国劳工统计局 (BLS)。截至2026年3月。
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = [
  '2022-01','2022-02','2022-03','2022-04','2022-05','2022-06',
  '2022-07','2022-08','2022-09','2022-10','2022-11','2022-12',
  '2023-01','2023-02','2023-03','2023-04','2023-05','2023-06',
  '2023-07','2023-08','2023-09','2023-10','2023-11','2023-12',
  '2024-01','2024-02','2024-03','2024-04','2024-05','2024-06',
  '2024-07','2024-08','2024-09','2024-10','2024-11','2024-12',
  '2025-01','2025-02','2025-03','2025-04','2025-05','2025-06',
  '2025-07','2025-08','2025-09','2025-10','2025-11','2025-12',
  '2026-01','2026-02','2026-03'
];
const fedRate = [
  0.25, 0.25, 0.50, 0.50, 1.00, 1.75,
  2.50, 2.50, 3.25, 3.25, 4.00, 4.50,
  4.50, 4.75, 5.00, 5.00, 5.25, 5.25,
  5.50, 5.50, 5.50, 5.50, 5.50, 5.50,
  5.50, 5.50, 5.50, 5.50, 5.50, 5.50,
  5.50, 5.50, 5.00, 5.00, 4.75, 4.50,
  4.50, 4.50, 4.50, 4.50, 4.50, 4.50,
  4.50, 4.50, 4.25, 4.25, 4.00, 3.75,
  3.75, 3.75, 3.75
];
const cpi = [
  7.5, 7.9, 8.5, 8.3, 8.6, 9.1,
  8.5, 8.3, 8.2, 7.7, 7.1, 6.5,
  6.4, 6.0, 5.0, 4.9, 4.0, 3.0,
  3.2, 3.7, 3.7, 3.2, 3.1, 3.4,
  3.1, 3.2, 3.5, 3.4, 3.3, 3.0,
  2.9, 2.5, 2.4, 2.6, 2.7, 2.9,
  3.0, 2.8, 2.4, 2.3, 2.4, 2.5,
  2.5, 2.5, 2.4, null, 2.7, 2.7,
  2.4, 2.4, null
];
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
new Chart(document.getElementById('fedChart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: '联邦基金利率（上限）',
        data: fedRate,
        borderColor: '#185FA5',
        backgroundColor: 'rgba(24,95,165,0.08)',
        borderWidth: 2.5,
        pointRadius: 0,
        pointHoverRadius: 5,
        tension: 0.15,
        fill: true,
        spanGaps: true
      },
      {
        label: 'CPI同比通胀率',
        data: cpi,
        borderColor: '#D85A30',
        backgroundColor: 'rgba(216,90,48,0.06)',
        borderWidth: 2.5,
        pointRadius: 0,
        pointHoverRadius: 5,
        tension: 0.3,
        fill: true,
        spanGaps: true
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: isDark ? '#2C2C2A' : '#fff',
        titleColor: isDark ? '#F1EFE8' : '#2C2C2A',
        bodyColor: isDark ? '#D3D1C7' : '#5F5E5A',
        borderColor: isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.12)',
        borderWidth: 0.5,
        padding: 10,
        displayColors: true,
        callbacks: {
          label: function(ctx) {
            return ctx.dataset.label + ': ' + (ctx.parsed.y !== null ? ctx.parsed.y.toFixed(1) + '%' : 'N/A');
          }
        }
      },
      annotation: undefined
    },
    scales: {
      x: {
        grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' },
        ticks: {
          color: isDark ? '#B4B2A9' : '#888780',
          font: { size: 11 },
          maxRotation: 45,
          autoSkip: true,
          maxTicksLimit: 12,
          callback: function(val, idx) {
            const l = labels[idx];
            const m = l.split('-')[1];
            if (m === '01' || m === '07') return l;
            return '';
          }
        }
      },
      y: {
        min: 0,
        max: 10,
        grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' },
        ticks: {
          color: isDark ? '#B4B2A9' : '#888780',
          font: { size: 11 },
          stepSize: 1,
          callback: function(v) { return v + '%'; }
        }
      }
    }
  }
});
</script>
